<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hit &amp; Blow | 4桁の暗号解読ゲーム</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google tag (gtag.js) -->
    <script src="config.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6QX2XHT2D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      if (typeof gtagId !== 'undefined') {
        gtag('config', gtagId);
      } else {
        gtag('config', 'G-S6QX2XHT2D');
      }
    </script>
</head>
<body>
    <!-- HTML5 Canvas for victory celebrations -->
    <canvas id="celebration-canvas"></canvas>

    <div id="app-wrapper">
        <header class="game-header">
            <div class="logo-area">
                <span class="badge-tag">CODEBREAKER</span>
                <h1>HIT &amp; BLOW</h1>
            </div>
            <div class="header-actions">
                <button id="sound-toggle" class="icon-btn" title="サウンド切り替え" aria-label="Sound Toggle">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <main id="game-container">
            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-label">BEST RECORD</span>
                    <span id="best-score" class="stat-value">-- ターン</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">CURRENT TURN</span>
                    <span id="current-turn" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">GAMES PLAYED</span>
                    <span id="games-played" class="stat-value">0</span>
                </div>
            </div>

            <!-- Subtitle -->
            <p class="game-subtitle">重複のない4桁の数字（0〜9）を予想してください。</p>

            <!-- Input Section -->
            <section id="input-section" class="card">
                <div id="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="guess-input" maxlength="4" placeholder="例: 1234" autocomplete="off" inputmode="numeric">
                    </div>
                    <button id="guess-button" class="primary-btn">
                        <span>予想する</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </div>
                <div id="message-area" class="message-area"></div>
            </section>

            <!-- History Log -->
            <section id="history-section" class="card">
                <div class="section-title">
                    <h2>試行履歴</h2>
                    <span id="history-count" class="badge">0 件</span>
                </div>
                <div id="history-scroll-container">
                    <ul id="history-list"></ul>
                    <div id="empty-history" class="empty-state">
                        <p>数字を入力して「予想する」を押してください</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Victory Modal -->
        <div id="victory-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div id="modal-celebration-badge" class="celebration-badge">MISSION COMPLETE</div>
                <h2 id="modal-title">祝！暗号解読成功！</h2>
                <div id="modal-message" class="modal-body-text"></div>
                <div class="modal-stats">
                    <div class="modal-stat-item">
                        <span class="modal-stat-label">クリアターン数</span>
                        <span id="modal-turns" class="modal-stat-val">--</span>
                    </div>
                    <div class="modal-stat-item">
                        <span class="modal-stat-label">正解の数字</span>
                        <span id="modal-secret" class="modal-stat-val secret-code">----</span>
                    </div>
                </div>
                <button id="reset-button" class="primary-btn reset-btn">
                    <span>新しいゲームを始める</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
